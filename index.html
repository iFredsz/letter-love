<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Fery ❤️ Niki</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/sun0225SUN/photos/img/20210715233345.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0px;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: manipulation;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif;
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .namebox {
            color: #ff5ba5;
            position: absolute;
            z-index: 9999;
            top: 50%;
            left: 50%;
            -webkit-transform: translate(-50%, -50%);
            -moz-transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
            -o-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            transition: 1s;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }

        .namebox h1 {
            margin: 0 auto;
            font-family: 'Poppins', 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            font-size: clamp(1.6rem, 6vw, 2.4rem);
            font-weight: 700;
            line-height: 1.3;
            text-shadow: 0 0 15px rgba(255, 91, 165, 0.8), 0 0 30px rgba(255, 91, 165, 0.4);
        }

        /* Romantic Welcome Start Screen */
        #welcomeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #260a1e 0%, #050105 100%);
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            padding: 20px;
        }

        #welcomeOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .welcome-box {
            background: rgba(255, 91, 165, 0.08);
            border: 1px solid rgba(255, 91, 165, 0.35);
            border-radius: 24px;
            padding: 40px 30px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(255, 91, 165, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 340px;
            width: 100%;
            text-align: center;
        }

        .welcome-icon {
            font-size: 55px;
            animation: pulseHeart 1.4s infinite ease-in-out;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 15px #ff5ba5);
        }

        .welcome-title {
            color: #ffffff;
            font-family: 'Poppins', 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 22px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 91, 165, 0.6);
        }

        .welcome-btn {
            background: linear-gradient(135deg, #ff5ba5 0%, #ff2d87 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 13px 28px;
            font-size: 15px;
            font-family: 'Poppins', 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 91, 165, 0.6);
            transition: all 0.3s ease;
            outline: none;
            user-select: none;
        }

        .welcome-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 30px rgba(255, 91, 165, 0.9);
        }

        .welcome-btn:active {
            transform: scale(0.96);
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.22); }
            28% { transform: scale(1); }
            42% { transform: scale(1.22); }
            70% { transform: scale(1); }
        }
        /* Subtitle Lyrics Box - Modern Clean Typography */
        #lyricsContainer {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            width: 92%;
            max-width: 600px;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            background: rgba(15, 3, 15, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 91, 165, 0.4);
            border-radius: 25px;
            padding: 14px 24px;
            box-shadow: 0 0 30px rgba(255, 91, 165, 0.35);
            opacity: 0;
        }

        #lyricsContainer.active {
            opacity: 1;
        }

        .lyric-text {
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif;
            font-size: clamp(14px, 3.8vw, 17px);
            font-weight: 600;
            letter-spacing: 0.3px;
            text-shadow: 0 0 10px rgba(255, 91, 165, 0.9), 0 0 20px rgba(255, 91, 165, 0.5);
            line-height: 1.45;
        }
    </style>

</head>

<body>
    <!-- Welcome Overlay: Klik untuk membuka pesan & memutar musik -->
    <div id="welcomeOverlay">
        <div class="welcome-box">
            <div class="welcome-icon">💌</div>
            <div class="welcome-title">Dear Niki 💖</div>
            <button id="openBtn" class="welcome-btn">✨ Buka ✨</button>
        </div>
    </div>

    <canvas id="canvas-matrix" style="position:absolute;width:100%;height:100%;z-index:8888"></canvas>
    <!-- <canvas id="canvas" style="position:absolute;width:100%;height:100%;z-index:8888"></canvas> -->
    <canvas style="position:absolute;width:100%;height:100%;z-index:9999" class="canvas"></canvas>
    <div class="overlay">
        <div class="tabs">
            <div class="tabs-labels"><span class="tabs-label">Commands</span><span class="tabs-label">Info</span><span
                    class="tabs-label">Share</span></div>

            <div class="tabs-panels">
                <ul class="tabs-panel commands">
                </ul>
            </div>
        </div>
    </div>
    <canvas id="pinkboard" style="position:absolute;width:100%;height:100%;z-index:8888"></canvas>

    <!-- Subtitle Lyrics Bar (Bahasa Indonesia Modern Clean Font) -->
    <div id="lyricsContainer">
        <div id="lyricText" class="lyric-text"></div>
    </div>

    <script src="js/index.js"></script>
    <script src="js/heart.js"></script>
    <script src="js/matrix.js"></script>
    <div class="namebox" style="opacity: 0;">
        <h1>
            Fery &#10084;&#65039; Niki<br>
            <span style="display: block; font-size: 0.75em; letter-spacing: 3px; margin-top: 6px; opacity: 0.95; font-weight: 600;">Saklawase</span>
        </h1>
    </div>

    <!-- HTML5 Audio Player (100% Kompatibel dengan Vercel & Localhost) -->
    <audio id="bgMusic" src="music.mp3" loop preload="auto" playsinline>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        var audio = document.getElementById('bgMusic');
        var openBtn = document.getElementById('openBtn');
        var welcomeOverlay = document.getElementById('welcomeOverlay');
        var lyricsBox = document.getElementById('lyricsContainer');
        var lyricTextEl = document.getElementById('lyricText');
        var isStarted = false;

        audio.volume = 0.9;

        // Subtitle Lirik Sinkron Bahasa Indonesia
        var lyricsData = [
            { time: 13.7, text: "Mungkin kau belum menyadarinya..." },
            { time: 17.1, text: "Namun saat pertama kali kita bertemu..." },
            { time: 20.2, text: "Aku begitu gugup & terpana hingga tak mampu berkata-kata..." },
            { time: 26.2, text: "Di detik itulah aku tahu, aku telah menemukan belahan jiwaku..." },
            { time: 32.8, text: "Dan hidupku telah menemukan kepingan yang melengkapinya..." },
            { time: 39.8, text: "Maka seumur hidupku, aku akan selalu mencintaimu..." },
            { time: 43.9, text: "Akan selalu menjaga dan mendekapmu erat..." },
            { time: 47.0, text: "Kau begitu anggun, cantik, dan sempurna..." },
            { time: 52.3, text: "Dan dari sekarang hingga hembusan nafasku yang terakhir..." },
            { time: 56.5, text: "Hari ini dan cintamu akan selalu kujaga selamanya..." },
            { time: 59.7, text: "Kau bidadari terindah dalam hidupku malam ini..." },
            { time: 72.1, text: "Cinta kita abadi tak lekang oleh waktu..." },
            { time: 75.4, text: "Kasih sayangku takkan pernah ada habisnya..." },
            { time: 78.5, text: "Dan dengan segenap ketulusan, kuucapkan pada semesta..." },
            { time: 84.6, text: "Kaulah alasanku bahagia..." },
            { time: 87.8, text: "Kaulah segalanya yang kupercaya..." },
            { time: 91.3, text: "Dari lubuk hatiku yang terdalam, kuucap janji setia ini..." },
            { time: 98.0, text: "Maka seumur hidupku, aku akan selalu mencintaimu..." },
            { time: 102.2, text: "Akan terus mendampingi dan melindungimu..." },
            { time: 105.4, text: "Kau begitu anggun dan mempesona..." },
            { time: 110.6, text: "Dan dari sekarang hingga hembusan nafasku yang terakhir..." },
            { time: 114.9, text: "Cinta ini akan selalu kusyukuri selamanya..." },
            { time: 118.1, text: "Kau begitu cantik dan memukau malam ini..." },
            { time: 130.9, text: "Kau bidadari terindah dalam hidupku..." },
            { time: 144.2, text: "Begitu sempurna... cintaku..." },
            { time: 152.1, text: "Dan jika kelak kita dikaruniai seorang putri..." },
            { time: 155.9, text: "Kuharap ia memiliki mata indah sepertimu..." },
            { time: 159.1, text: "Menemukan cinta sejati seperti cinta kita berdua..." },
            { time: 164.5, text: "Dan kelak saat ia dewasa dan menemukan cintanya..." },
            { time: 168.6, text: "Ku antar dia menuju pelaminan..." },
            { time: 171.8, text: "Ia akan secantik dirimu yang anggun..." },
            { time: 181.3, text: "Kau bidadari terindahku..." },
            { time: 186.5, text: "Maka seumur hidupku, aku akan selalu mencintaimu..." },
            { time: 190.7, text: "Akan terus mendekap dan menyayangimu..." },
            { time: 193.8, text: "Kau begitu anggun dan sempurna..." },
            { time: 199.3, text: "Dan dari sekarang hingga nafas terakhirku..." },
            { time: 203.5, text: "Cinta ini akan selalu kujaga selamanya..." },
            { time: 206.7, text: "Kau bidadari terindahku malam ini..." },
            { time: 215.0, text: "Fery ❤️ Niki — Saklawase ❤️" }
        ];

        var lastIndex = -1;
        var LYRIC_OFFSET = 0.85; // Memajukan subtitle ~0.85 detik agar teks muncul tepat saat vokal mulai berbunyi

        // Update Subtitle Sinkron Presisi Tinggi
        function updateSubtitle() {
            if (!audio || audio.paused) return;
            var currTime = audio.currentTime + LYRIC_OFFSET;
            var activeIdx = -1;

            for (var i = lyricsData.length - 1; i >= 0; i--) {
                if (currTime >= lyricsData[i].time) {
                    activeIdx = i;
                    break;
                }
            }

            if (activeIdx === -1) {
                lyricsBox.classList.remove('active');
            } else if (activeIdx !== lastIndex) {
                lastIndex = activeIdx;
                lyricTextEl.textContent = lyricsData[activeIdx].text;
                lyricsBox.classList.add('active');
            }
        }

        audio.addEventListener('timeupdate', updateSubtitle);
        setInterval(updateSubtitle, 100); // Pemeriksaan setiap 100ms untuk presisi maksimal

        function startExperience() {
            if (isStarted) return;
            isStarted = true;

            // 1. Putar lagu Beautiful in White seketika
            audio.play().catch(function(err) {
                console.log("Audio play error:", err);
            });

            // 2. Hilangkan layar pembuka dengan transisi mulus
            welcomeOverlay.classList.add('hidden');
            setTimeout(function() {
                welcomeOverlay.style.display = 'none';
            }, 800);

            // 3. Jalankan animasi 3..2..1 tepat saat musik mulai berputar
            if (window.startLoveApp) {
                window.startLoveApp();
            }
        }

        // Trigger saat tombol ditekan
        openBtn.addEventListener('click', startExperience);
        openBtn.addEventListener('touchstart', startExperience, { passive: true });
    </script>
</body>

</html>
